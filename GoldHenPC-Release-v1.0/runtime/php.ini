[PHP]
extension_dir = "ext"
expose_php = Off
display_errors = Off
log_errors = On
error_log = "user/logs/php-error.log"
max_execution_time = 300
max_input_time = 300
memory_limit = 512M
post_max_size = 18M
upload_max_filesize = 16M
default_socket_timeout = 120
extension=curl
extension=fileinfo
extension=ftp
extension=gd
extension=mbstring
extension=openssl
extension=sockets
extension=zip
opcache.file_cache = "user/cache/opcache"
opcache.file_cache_fallback = 1
